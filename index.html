@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--paper:#141318;--card:#1c1b22;--ink:#ece7de;--muted:#a8a0a8;--gold:#d3b072;--gold-soft:#4a3f2b;--line:#34323c;--danger:#e39a93;--warn-bg:#2f2323;--noise:none}
}
:root[data-theme="dark"]{--paper:#141318;--card:#1c1b22;--ink:#ece7de;--muted:#a8a0a8;--gold:#d3b072;--gold-soft:#4a3f2b;--line:#34323c;--danger:#e39a93;--warn-bg:#2f2323;--noise:none}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background-color:var(--paper);background-image:var(--noise);color:var(--ink);
  font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:19px;line-height:1.4;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
.app{width:100%;max-width:480px;margin:0 auto;padding:0 16px 28px;flex:1 0 auto}
header{text-align:center;padding:0 0 12px}
header::before{content:"";display:block;height:104px;margin:0 -16px 14px;background:var(--diamond) repeat-x;background-size:70px 104px}
.logo{display:block;margin:0 auto 6px;height:84px;width:auto}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .logo{filter:brightness(1.6)}}
:root[data-theme="dark"] .logo{filter:brightness(1.6)}
.script,h2,h3,.day,.time,.sub,.btn,nav button{font-family:'Cormorant SC','Cormorant Garamond',Georgia,serif}
.script{font-size:34px;font-weight:500;letter-spacing:.14em;line-height:1.1}
.sub{letter-spacing:.22em;font-size:14px;font-weight:600;margin-top:4px}
.example{border-top:1px solid var(--line);border-bottom:1px solid var(--line);color:var(--muted);font-style:italic;font-size:16px;text-align:center;padding:8px 12px;margin:12px 0}
.top-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:8px 0}
.btn{font-size:15px;font-weight:600;letter-spacing:.1em;border:1px solid var(--ink);color:var(--ink);background:transparent;border-radius:0;
  padding:6px 12px;text-decoration:none;cursor:pointer;min-height:36px;display:inline-flex;align-items:center}
.btn.fill{background:var(--ink);color:var(--paper)}
.btn:focus-visible,nav button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{position:relative;margin:78px 2px 0;padding:34px 16px 26px;background:var(--card);border:2px solid var(--ink)}
main::before{content:"";position:absolute;inset:5px;border:1px solid var(--ink);pointer-events:none}
main::after{content:"";position:absolute;left:-24px;top:-66px;width:170px;height:125px;background:var(--hyd) no-repeat;background-size:contain;pointer-events:none}
.tab{display:none}.tab.active{display:block}
h2,.day,h3,.time{text-align:center}
h2{font-size:34px;font-weight:500;letter-spacing:.1em;margin:4px 0 16px}
h2.sm{font-size:26px;margin-top:26px}
.day{font-size:19px;font-weight:600;letter-spacing:.07em;margin:26px 0 8px}
h3{font-size:23px;font-weight:700;letter-spacing:.08em;margin-top:4px}
.card{border-bottom:1px solid var(--line);text-align:center;padding:10px 4px 18px}
.row{display:flex;flex-direction:column;align-items:center;gap:2px}
.time{font-size:20px;font-weight:600;letter-spacing:.1em;color:var(--gold)}
.meta{color:var(--muted);font-size:17px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;justify-content:center}
.warn{background:var(--warn-bg);border-top:3px double var(--danger);border-bottom:3px double var(--danger);padding:12px 14px;margin:12px 0;text-align:center}
.warn strong{color:var(--danger)}
.tag{display:inline-block;font-family:'Cormorant SC',serif;font-size:13px;letter-spacing:.1em;color:var(--gold);border:1px solid var(--gold);padding:0 8px;margin-top:6px}
ul.info{list-style:none}
ul.info li{padding:8px 0;border-bottom:1px solid var(--line);text-align:center}
ul.info li:last-child{border:0}
nav{position:sticky;bottom:0;width:100%;flex:0 0 auto;background:var(--card);border-top:1px solid var(--ink);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:10}
nav button{flex:1;font-size:13px;font-weight:600;letter-spacing:.08em;background:none;border:0;color:var(--muted);padding:10px 2px;cursor:pointer;min-height:56px}
nav button .ic{display:block;font-size:20px;line-height:1.1;font-family:serif}
nav button.active{color:var(--gold)}
</style>

/* ---------- utilidades de fuso / datas ---------- */
const pad = n => String(n).padStart(2,"0");
// Converte "YYYY-MM-DDTHH:MM" em um fuso IANA para um instante UTC (Date).
function zonedToUtc(local, tz){
  const [d,t] = local.split("T"); const [y,m,da] = d.split("-").map(Number); const [h,mi] = t.split(":").map(Number);
  const guess = Date.UTC(y,m-1,da,h,mi);
  const off = tzOffsetMs(guess, tz);
  let utc = guess - off;
  const off2 = tzOffsetMs(utc, tz);       // corrige em transições de horário de verão
  if(off2 !== off) utc = guess - off2;
  return new Date(utc);
}
function tzOffsetMs(utcMs, tz){
  const p = new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit"})
    .formatToParts(new Date(utcMs)).reduce((a,x)=>(a[x.type]=x.value,a),{});
  return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute,p.second) - Math.floor(utcMs/1000)*1000;
}
const fmtUtc = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth()+1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
const fmtDay = s => s.replace(/-/g,"");
const nextDay = s => { const d=new Date(s+"T00:00:00Z"); d.setUTCDate(d.getUTCDate()+1); return d.toISOString().slice(0,10); };
const fmtDate = s => new Date(s+"T12:00:00Z").toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",timeZone:"UTC"});
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- normaliza tudo em "eventos" ---------- */
function allEvents(){
  const ev = [];
  TRIP.flights.forEach(f=>ev.push({uid:f.id,title:`✈ ${f.label}: ${f.from} → ${f.to} (${f.code})`,
    start:zonedToUtc(f.dep,f.depTz), end:zonedToUtc(f.arr,f.arrTz), place:f.from, desc:`Voo ${f.code}`}));
  TRIP.hotels.forEach(h=>ev.push({uid:h.id,title:`⌂ ${h.name}`,allDay:true,startDay:h.checkIn,endDay:h.checkOut,place:h.address,desc:h.notes||""}));
  TRIP.activities.forEach(a=>{
    if(a.allDay) return ev.push({uid:a.id,title:a.title,allDay:true,startDay:a.day,endDay:nextDay(a.day),place:a.place,desc:a.desc||""});
    const st=zonedToUtc(`${a.day}T${a.start}`,a.tz);
    const en=a.end ? zonedToUtc(`${a.day}T${a.end}`,a.tz) : new Date(st.getTime()+(a.dur||180)*60e3);
    ev.push({uid:a.id,title:a.title,start:st,end:en,place:a.place,desc:a.desc||""});
  });
  return ev;
}
function gcalUrl(e){
  const dates = e.allDay ? `${fmtDay(e.startDay)}/${fmtDay(e.endDay)}` : `${fmtUtc(e.start)}/${fmtUtc(e.end)}`;
  const q = new URLSearchParams({action:"TEMPLATE",text:e.title,dates,details:e.desc||"",location:e.place||""});
  return "https://calendar.google.com/calendar/render?"+q.toString();
}
const icsEsc = s => String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\n/g,"\\n");
function vevent(e){
  const L=["BEGIN:VEVENT",`UID:${e.uid}@luizaemarcos`,`DTSTAMP:${fmtUtc(new Date())}`];
  if(e.allDay){L.push(`DTSTART;VALUE=DATE:${fmtDay(e.startDay)}`,`DTEND;VALUE=DATE:${fmtDay(e.endDay)}`);}
  else L.push(`DTSTART:${fmtUtc(e.start)}`,`DTEND:${fmtUtc(e.end)}`);
  L.push(`SUMMARY:${icsEsc(e.title)}`,`LOCATION:${icsEsc(e.place)}`,`DESCRIPTION:${icsEsc(e.desc)}`,"END:VEVENT");
  return L.join("\r\n");
}
function download(name, events){
  const body = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Luiza e Marcos//Guia de Viagem//PT","CALSCALE:GREGORIAN",...events.map(vevent),"END:VCALENDAR"].join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([body],{type:"text/calendar;charset=utf-8"}));
  a.download=name; document.body.appendChild(a); a.click(); a.remove();
}
const EV = Object.fromEntries(allEvents().map(e=>[e.uid,e]));
const btns = (id,extra="") => `<div class="btns">
  <a class="btn" target="_blank" rel="noopener" href="${esc(gcalUrl(EV[id]))}">Google Agenda</a>
  <button class="btn" data-ics="${id}">.ics</button>${extra}</div>`;

function fmtLocal(iso,tz){ const d=zonedToUtc(iso,tz);
  return d.toLocaleString("pt-BR",{timeZone:tz,day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}); }

document.addEventListener("click",e=>{

});

$("themeBtn").addEventListener("click",()=>{
  const r=document.documentElement;
  const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  r.dataset.theme = dark ? "light" : "dark";
});
